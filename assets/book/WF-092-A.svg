="70" y="1230" font-size="24">1 Coiled Entrance · well shaft 30 ft</text><text x="70" y="1268" font-size="24">2 Sacrificial Chamber · basin 10 × 15 ft</text><text x="70" y="1306" font-size="24">3 Confession Chamber · tombs 3a–3c</text><text x="70" y="1344" font-size="24">4 Master’s Antechamber · two statues</text><text x="70" y="1382" font-size="24">5 Brother Ottavio’s Tomb</text><text x="70" y="1420" font-size="24">6 Living Quarters · 6a Waystone · R Rumbold</text><text x="70" y="1458" font-size="24">7 Shrine of the Serpent · C Corvino</text><text x="70" y="1496" font-size="24">8 Black Depths · shaft and onward tunnels</text><text x="70" y="1576" font-size="22">Gold crosses: sealed doors. Corridor bends and all unstated footprints are proposed,</text><text x="70" y="1606.36" font-size="22">not a survey.</text><text x="70" y="1643.3199999999997" font-size="22">Dashed snake network: 6-inch passages; Tiny-creature destinations use the source d12</text><text x="70" y="1673.6799999999996" font-size="22">procedure.</text><text x="70" y="1710.6399999999994" font-size="22">Ceilings: 10 ft; area 8: 20 ft. Use player plan with fog of war.</text></g></svg>
