<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2700" viewBox="0 0 1200 900"><title>Diagram: the Treasury Compass moondial</title><desc>WeaveFall editable source-based vector artwork. Unspecified staging remains proposed.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><circle cx="600" cy="365" r="260" fill="#dee5df" stroke="#777970" stroke-width="7"></circle><circle cx="600" cy="365" r="211" fill="none" stroke="#c9d3d4" stroke-width="16"></circle><circle cx="600" cy="365" r="153" fill="none" stroke="#244c4c" stroke-width="2"></circle><g transform="translate(600 108) scale(1)"><circle cx="0" cy="0" r="37" fill="#244c4c" stroke="#b99b59" stroke-width="2"></circle><path d="M0,-37 A37,37 0 0 0 0,37 Z" fill="#e4eceb"></path></g><text x="600" y="37" font-size="26" text-anchor="middle">North</text><text x="600" y="71" font-size="23" text-anchor="middle">Third quarter</text><g transform="translate(866 365) scale(1)"><circle cx="0" cy="0" r="37" fill="#e4eceb" stroke="#b99b59" stroke-width="2"></circle></g><text x="1090" y="360" font-size="26" text-anchor="middle">East</text><text x="1090" y="394" font-size="23" text-anchor="middle">Full moon</text><g transform="translate(600 630) scale(1)"><circle cx="0" cy="0" r="37" fill="#244c4c" stroke="#b99b59" stroke-width="2"></circle><path d="M0,-37 A37,37 0 0 1 0,37 Z" fill="#e4eceb"></path></g><text x="600" y="710" font-size="26" text-anchor="middle">South</text><text x="600" y="744" font-size="23" text-anchor="middle">First quarter</text><g transform="translate(338 365) scale(1)"><circle cx="0" cy="0" r="37" fill="#244c4c" stroke="#b99b59" stroke-width="2"></circle></g><text x="116" y="360" font-size="26" text-anchor="middle">West</text><text x="116" y="394" font-size="23" text-anchor="middle">New moon</text><path d="M576,401 L605,278 L634,401 Z" fill="#244c4c" stroke="#173b3c" stroke-width="3"></path><text x="600" y="449" font-size="23" text-anchor="middle">Center Spire</text><text x="600" y="795" font-size="24" text-anchor="middle">Read the night-time moondial for the current point.</text><text x="600" y="840" font-size="22" text-anchor="middle">Calendar date comes from Appendix A, not character level.</text></svg>
