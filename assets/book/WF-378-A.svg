<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="4740" viewBox="0 0 900 1580"><title>Caravan route diagram</title><desc>WeaveFall editable source-based vector artwork. Unspecified staging remains proposed.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs ><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#244c4c"></path></marker></defs><text x="450" y="66" font-size="33" text-anchor="middle" font-weight="bold">THE FLAMES OF BETRAYAL</text><g id="stage-1" data-round="1" data-villain="V1"><path d="M158,163 H725 V355 H158 Z" fill="#edf1ea" stroke="#b99b59" stroke-width="2"></path><text x="450" y="208" font-size="31" text-anchor="middle" font-weight="bold">Round 1</text><text x="450" y="253" font-size="28" text-anchor="middle">V1 blocks the gatehouse</text><text x="450" y="291" font-size="23" text-anchor="middle">Secure or bypass the gate.</text></g><rect x="222" y="320" width="46" height="39" fill="#cad8cb" stroke="#244c4c" stroke-width="2"></rect><text x="245" y="345" font-size="23" text-anchor="middle">C</text><path d="M295,338 H629" fill="none" stroke="#244c4c" stroke-width="3" marker-end="url(#arrowhead)"></path><rect x="650" y="303" width="47" height="75" fill="#c4cab7" stroke="#173b3c" stroke-width="3"></rect><path d="M450,386 V494" fill="none" stroke="#244c4c" stroke-width="3" marker-end="url(#arrowhead)"></path><g id="stage-2" data-round="4" data-villain="V2"><path d="M158,542 H725 V734 H158 Z" fill="#edf1ea" stroke="#b99b59" stroke-width="2"></path><text x="450" y="587" font-size="31" text-anchor="middle" font-weight="bold">Round 4</text><text x="450" y="632" font-size="28" text-anchor="middle">V2 ambushes the crowd</text><text x="450" y="670" font-size="23" text-anchor="middle">Reach the convoy before it is overwhelmed.</text></g><rect x="222" y="699" width="46" height="39" fill="#cad8cb" stroke="#244c4c" stroke-width="2"></rect><text x="245" y="724" font-size="23" text-anchor="middle">C</text><path d="M295,717 H629" fill="none" stroke="#244c4c" stroke-width="3" marker-end="url(#arrowhead)"></path><rect x="650" y="682" width="47" height="75" fill="#c4cab7" stroke="#173b3c" stroke-width="3"></rect><path d="M450,765 V873" fill="none" stroke="#244c4c" stroke-width="3" marker-end="url(#arrowhead)"></path><g id="stage-3" data-round="7" data-villain="V3"><path d="M158,921 H725 V1113 H158 Z" fill="#edf1ea" stroke="#b99b59" stroke-width="2"></path><text x="450" y="966" font-size="31" text-anchor="middle" font-weight="bold">Round 7</text><text x="450" y="1011" font-size="28" text-anchor="middle">V3 strikes from behind</text><text x="450" y="1049" font-size="23" text-anchor="middle">Escort the crowd toward safety.</text></g><rect x="222" y="1078" width="46" height="39" fill="#cad8cb" stroke="#244c4c" stroke-width="2"></rect><text x="245" y="1103" font-size="23" text-anchor="middle">C</text><path d="M295,1096 H629" fill="none" stroke="#244c4c" stroke-width="3" marker-end="url(#arrowhead)"></path><rect x="650" y="1061" width="47" height="75" fill="#c4cab7" stroke="#173b3c" stroke-width="3"></rect><text x="110" y="1345" font-size="24">C: sixteen Merchant Lords as one Huge crowd, not three</text><text x="110" y="1378.12" font-size="24">wagons.</text><text x="110" y="1418.4399999999998" font-size="24">Crowd advances 30 ft at round end if unblocked. Eight</text><text x="110" y="1451.5599999999997" font-size="24">fighters escort it.</text><text x="110" y="1491.8799999999997" font-size="24">V2 appears round 4; V3 appears round 7. Positions are</text><text x="110" y="1524.9999999999995" font-size="24">schematic, not a tactical map.</text></svg>
