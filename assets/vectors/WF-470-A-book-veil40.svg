<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1956" viewBox="0 0 540 330"><title>The Wren crest</title><desc>Art Bible proposed family arms: wren, frost staff, wine and gold, five-thread Eye in chief. This heraldic reading is not presented as newly established campaign canon.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><g transform="translate(270 160) scale(0.95)"><path d="M-103,-119 Q0,-151 103,-119 V5 Q98,99 0,141 Q-98,99 -103,5 Z" fill="#d2b471" stroke="#244c4c" stroke-width="4"></path><path d="M-100,-118 H100 V0 H-100 Z" fill="#7a2b33"></path><path d="M-8,-70 V105 M-25,-45 L25,-15 M-25,-15 L25,-45" fill="none" stroke="#b5d7df" stroke-width="5"></path><g transform="translate(0 10) scale(0.95)"><path d="M-44,11 Q-26,-17 -1,-6 Q8,-33 31,-24 Q45,-20 48,-9 L66,-7 L48,1 Q42,27 10,30 Q-20,35 -36,20 L-69,-3 L-60,-33 L-41,2 M-7,2 Q15,0 27,14 Q9,24 -12,17 M-3,29 L-3,44 M17,29 L19,44" fill="none" stroke="#173b3c" stroke-width="3"></path><circle cx="33" cy="-12" r="2.5" fill="#173b3c"></circle></g><g transform="translate(0 -84) scale(0.24)"><circle cx="0" cy="0" r="104" fill="none" stroke="#244c4c" stroke-width="1.8"></circle><g id="five-open-threads"><path d="M0,-111 C-6,-79 -7,-36 0,-2" fill="none" stroke="#b99b59" stroke-width="3" data-thread="1"></path><path d="M106,-34 C70,-35 39,-24 1,0" fill="none" stroke="#b99b59" stroke-width="3" data-thread="2"></path><path d="M65,91 C56,49 30,16 2,1" fill="none" stroke="#b99b59" stroke-width="3" data-thread="3"></path><path d="M-65,91 C-46,54 -19,24 -1,2" fill="none" stroke="#b99b59" stroke-width="3" data-thread="4"></path><path d="M-106,-34 C-71,-32 -38,-15 -1,0" fill="none" stroke="#b99b59" stroke-width="3" data-thread="5"></path></g><path d="M0,-7 C13,-7 12,7 1,7 C-11,7 -12,-5 0,-7" fill="none" stroke="#b99b59" stroke-width="3"></path></g></g></svg>
