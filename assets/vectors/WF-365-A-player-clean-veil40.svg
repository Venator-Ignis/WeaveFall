<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="3000" viewBox="0 0 1200 1000"><title>Wall Breach: Guildsworth</title><desc>Source-led map. Block outlines and ally deployment are proposed; source quantities retained. This wall lies between Ember Ring and Undertow; it is not Wren Gate.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><g id="base-terrain"><rect x="0" y="0" width="1200" height="1000" fill="#fcfaf4"></rect></g><g id="structures"><rect x="0" y="0" width="1200" height="1000" fill="#e6e2d6"></rect><rect x="0" y="350" width="450" height="100" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="750" y="350" width="450" height="100" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="450" y="350" width="300" height="100" fill="#f1efe5" data-feature="breach" data-width-ft="30"></rect><rect x="100" y="590" width="250" height="220" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="850" y="590" width="250" height="220" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect></g></svg>
