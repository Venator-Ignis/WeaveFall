<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="3000" viewBox="0 0 1200 1000"><title>Flames of Betrayal: escape route</title><desc>Source-led map. Street footprints and initial deployments are proposed; V labels mean villains. No wagons are invented for the crowd; fire spreads by the encounter rules.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><g id="base-terrain"><rect x="0" y="0" width="1200" height="1000" fill="#fcfaf4"></rect></g><g id="structures"><rect x="0" y="0" width="1200" height="1000" fill="#e6e1d3"></rect><rect x="40" y="50" width="220" height="150" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="40" y="370" width="220" height="200" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="930" y="50" width="230" height="170" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="930" y="370" width="230" height="200" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="40" y="790" width="200" height="170" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="930" y="790" width="230" height="170" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="440" y="20" width="260" height="140" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="505" y="100" width="130" height="60" fill="#f1efe5" stroke="#173b3c" stroke-width="4"></rect><path d="M300,850 H800 V250 H300" fill="none" stroke="#f4efe1" stroke-width="160"></path></g><g id="grid"><defs ><pattern id="five-foot-grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50,0 H0 V50" fill="none" stroke="#567a72" stroke-width="0.8" opacity="0.4"></path></pattern></defs><rect x="0" y="0" width="1200" height="1000" fill="url(#five-foot-grid)"></rect></g></svg>
