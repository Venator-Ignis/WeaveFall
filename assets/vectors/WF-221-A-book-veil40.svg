<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="4800" viewBox="0 0 1200 1600"><title>Jackalwere den: streets and approaches</title><desc>Source-led map. Street widths and neighbouring footprints are proposed for play. This local plan does not relocate the den within Wrenhaven.</desc><style>text{font-family:Georgia,"Times New Roman",serif;fill:#173b3c}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="40" y="52" font-size="35" font-weight="bold">Jackalwere den: streets and approaches</text><text x="40" y="91" font-size="23">GM key • proposed footprints • source facts retained</text><g transform="translate(0 125) scale(1)"><g id="base-terrain"><rect x="0" y="0" width="1200" height="1000" fill="#fcfaf4"></rect></g><g id="structures"><path d="M0,810 H1200 V1000 H0 Z M560,0 H740 V810 H560 Z" fill="#ddd9ca"></path><rect x="50" y="100" width="450" height="600" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="790" y="120" width="350" height="260" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="790" y="480" width="350" height="230" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="30" y="760" width="400" height="30" fill="#d8d9d0" stroke="#173b3c" stroke-width="5"></rect><rect x="45" y="710" width="160" height="55" fill="#c69b63" stroke="#173b3c" stroke-width="2"></rect><path d="M500,160 H560 M500,530 H560 M790,540 H740" fill="none" stroke="#759088" stroke-width="18"></path></g><g id="grid"><defs ><pattern id="five-foot-grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50,0 H0 V50" fill="none" stroke="#567a72" stroke-width="0.8" opacity="0.4"></path></pattern></defs><rect x="0" y="0" width="1200" height="1000" fill="url(#five-foot-grid)"></rect></g><g id="gm-secrets"><g id="token-280-440" data-kind="site"><circle cx="280" cy="440" r="20" fill="#eee1c8" stroke="#244c4c" stroke-width="2"></circle><text x="280" y="447" font-size="22" text-anchor="middle" font-weight="bold